<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0E0B12" />
    <meta
      name="description"
      content="A personal operating system for one person. Goals, projects, tasks, habits, routines and reviews as one connected system. Local-first: your data stays in this browser."
    />
    <!--
      Local-first and single-user, so there is nothing to share and nothing to
      index. This keeps the app out of search results if it is ever hosted at a
      public URL.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Life OS</title>

    <!--
      Inline SVG favicon: the accent-coloured monogram from the sidebar. Inline
      rather than a file so there is no extra request and no 404 for
      /favicon.ico, and so the icon ships with the bundle rather than being a
      loose asset that can go missing.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316121A'/%3E%3Cpath d='M11 8v14h10' stroke='%23C13A56' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E"
    />
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316121A'/%3E%3Cpath d='M11 8v14h10' stroke='%23C13A56' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width: 34rem; margin: 18vh auto; padding: 0 1.5rem; font-family: system-ui, sans-serif; color: #EDEDF2">
        <h1 style="font-size: 1.4rem">Life OS needs JavaScript</h1>
        <p style="color: #A9AAB4; line-height: 1.6">
          Life OS runs entirely in your browser and stores your data locally, so
          it cannot work without JavaScript enabled. Nothing has been lost —
          enable JavaScript and reload to get back to your data.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
