<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      viewport-fit=cover lets the app draw under the notch and home indicator in
      Home Screen mode; the layout then pads itself with env(safe-area-inset-*).
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#09090C" />
    <meta
      name="description"
      content="A private personal operating system. Goals, projects, tasks, habits, routines and reviews as one connected system."
    />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Home Screen / standalone app metadata -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Life OS" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <title>Life OS</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width: 34rem; margin: 18vh auto; padding: 0 1.5rem; font-family: system-ui, sans-serif; color: #EDEDF2">
        <h1 style="font-size: 1.4rem">Life OS needs JavaScript</h1>
        <p style="color: #A9AAB4; line-height: 1.6">
          Life OS runs in your browser and stores your data on this device, so it
          cannot work without JavaScript. Nothing has been lost — enable
          JavaScript and reload.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
